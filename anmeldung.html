
<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Mitarbeiter-Login | Wurzelspitze</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="mitarbeiter-seite">

  <section class="login-bereich">

    <div class="login-karte">

      <div class="login-symbol">🔒</div>

      <h1>Mitarbeiter-Login</h1>

      <p>Zahnarztpraxis Wurzelspitze</p>

      <form id="anmeldeformular">

        <label for="email">E-Mail-Adresse</label>
        <input
          type="email"
          id="email"
          autocomplete="username"
          required>

        <label for="passwort">Passwort</label>
        <input
          type="password"
          id="passwort"
          autocomplete="current-password"
          required>

        <button type="submit" class="login-zurueck">
          Anmelden
        </button>

        <p id="login-fehler" role="alert"></p>

      </form>

      <p>
        <a href="index.html">
          Zurück zur Praxiswebsite
        </a>
      </p>

    </div>

  </section>

</main>

<script type="module" src="auth.js"></script>

</body>
</html>
